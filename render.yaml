services:
  - type: web
    name: ai-chatbot-api
    runtime: node
    plan: free
    buildCommand: npm install && cd frontend && npm install && cd .. && npm run build:all
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: onboarding@resend.dev
      - key: SENTRY_DSN
        sync: false
